<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClinicalKey AI — Customer Hub (Wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1f2430;
    --muted:#6b7280;
    --faint:#9aa1ad;
    --line:#d4d8de;
    --line-strong:#b8bec9;
    --canvas:#f4f5f7;
    --panel:#ffffff;
    --ph:#eceef1;
    --accent:#2c6e74;
    --accent-soft:#e7f0f1;
    --note:#9a5b00;
    --note-bg:#fdf4e3;
    --note-line:#e4c989;
    --radius:6px;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--canvas);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--mono);}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--faint);
    font-weight:500;
  }
  button{font-family:inherit;cursor:pointer;}
  a{color:var(--accent);}

  /* ---------- App shell ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;gap:16px;
    padding:12px 24px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-ph{
    width:34px;height:34px;border:1.5px dashed var(--line-strong);
    border-radius:5px;display:grid;place-items:center;
    font-family:var(--mono);font-size:9px;color:var(--faint);
    background:var(--ph);
  }
  .brand .name{font-weight:700;font-size:15px;line-height:1.1;}
  .brand .sub{font-size:11px;color:var(--muted);}
  .topbar .spacer{flex:1;}
  .role-chip{
    display:none;font-family:var(--mono);font-size:11px;
    padding:5px 10px;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);background:var(--canvas);
  }
  body[data-screen="journey"] .role-chip,
  body[data-screen="done"] .role-chip{display:inline-flex;}
  .tlink{
    font-size:13px;color:var(--muted);text-decoration:none;
    padding:6px 10px;border-radius:5px;
  }
  .tlink:hover{background:var(--canvas);color:var(--ink);}
  .notes-toggle{
    font-size:12px;font-weight:500;
    padding:6px 12px;border-radius:5px;
    border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);
  }
  .notes-toggle .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--note-line);margin-right:6px;vertical-align:middle;}
  body.notes-on .notes-toggle{background:var(--note-bg);border-color:var(--note-line);color:var(--note);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  .fidelity-strip{
    text-align:center;padding:7px;background:#23272f;color:#cfd4dc;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  }

  /* ---------- Design notes ---------- */
  .note{display:none;}
  body.notes-on .note{
    display:block;
    margin:10px 0;
    background:var(--note-bg);
    border:1px solid var(--note-line);
    border-left:3px solid var(--note);
    border-radius:5px;
    padding:9px 12px;
    font-size:12.5px;color:#5c4413;line-height:1.45;
  }
  body.notes-on .note b{color:var(--note);}
  .note .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--note);display:block;margin-bottom:3px;}

  /* ---------- Landing ---------- */
  .landing{padding:48px 0 64px;}
  .landing .hero{max-width:680px;}
  .landing h1{font-size:34px;line-height:1.12;margin:10px 0 12px;font-weight:700;letter-spacing:-0.01em;}
  .landing .lede{font-size:16px;color:var(--muted);margin:0;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:34px 0 0;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;display:flex;flex-direction:column;gap:12px;
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .card:hover{border-color:var(--accent);box-shadow:0 4px 18px rgba(31,36,48,.07);transform:translateY(-2px);}
  .card .icon{
    width:42px;height:42px;border-radius:6px;background:var(--accent-soft);
    display:grid;place-items:center;color:var(--accent);
  }
  .card h3{margin:0;font-size:18px;font-weight:600;}
  .card .who{font-size:13px;color:var(--muted);margin:0;}
  .card ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted);}
  .card ul li{margin:3px 0;}
  .card .go{
    margin-top:auto;align-self:flex-start;
    background:var(--accent);color:#fff;border:none;
    padding:10px 16px;border-radius:5px;font-size:13.5px;font-weight:600;
  }
  .card .go:hover{filter:brightness(1.06);}
  .capture{
    margin-top:28px;background:var(--panel);border:1px dashed var(--line-strong);
    border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;
    gap:12px;flex-wrap:wrap;
  }
  .capture .lbl{font-size:13px;color:var(--muted);flex:1;min-width:220px;}
  .capture input{
    flex:1;min-width:200px;padding:9px 11px;border:1px solid var(--line-strong);
    border-radius:5px;font-family:inherit;font-size:13px;background:var(--canvas);
  }
  .capture button{
    padding:9px 14px;border:1px solid var(--line-strong);background:var(--canvas);
    border-radius:5px;font-size:13px;color:var(--ink);
  }

  /* ---------- Journey ---------- */
  .journey{display:grid;grid-template-columns:288px minmax(0,1fr) 300px;gap:28px;padding:30px 0 64px;align-items:start;}
  .rail{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;position:sticky;top:78px;
  }
  .rail .rtitle{font-size:14px;font-weight:600;margin:0 0 2px;}
  .rail .rmeta{font-size:12px;color:var(--muted);margin:0 0 12px;}
  .bar{height:6px;background:var(--ph);border-radius:999px;overflow:hidden;margin-bottom:16px;}
  .bar > span{display:block;height:100%;background:var(--accent);transition:width .25s;}
  .steps{list-style:none;margin:0;padding:0;}
  .steps li{
    display:flex;gap:10px;align-items:flex-start;
    padding:9px 8px;border-radius:5px;cursor:pointer;
    border:1px solid transparent;
  }
  .steps li:hover{background:var(--canvas);}
  .steps li.active{background:var(--accent-soft);border-color:#bcd6d8;}
  .steps li .num{
    flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);
    display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);
    background:var(--panel);margin-top:1px;
  }
  .steps li.active .num{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .steps li.done .num{background:var(--accent);border-color:var(--accent);color:#fff;}
  .steps li .stxt{font-size:13px;line-height:1.35;}
  .steps li .opt{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);display:block;margin-top:2px;}
  .rail .switch{margin-top:14px;font-size:12.5px;background:none;border:none;color:var(--accent);padding:0;}
  .rail .switch:hover{text-decoration:underline;}

  .stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:30px 34px;}
  .stage h2{font-size:24px;margin:8px 0 10px;font-weight:600;letter-spacing:-0.01em;}
  .stage .narr{font-size:15px;color:#414855;margin:0 0 20px;max-width:62ch;}

  .media{
    border:2px dashed var(--line-strong);border-radius:var(--radius);
    background:var(--ph);margin:0 0 14px;position:relative;overflow:hidden;
  }
  .media .kind{
    position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 7px;
  }
  .media.video{aspect-ratio:16/9;display:grid;place-items:center;}
  .media.video .play{
    width:62px;height:62px;border-radius:50%;background:var(--panel);border:1px solid var(--line-strong);
    display:grid;place-items:center;
  }
  .media.video .play::after{content:"";border-left:18px solid var(--accent);
    border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px;}
  .media.video .vcap{position:absolute;bottom:12px;left:0;right:0;text-align:center;
    font-size:12.5px;color:var(--muted);}
  .media.doc{min-height:360px;display:flex;flex-direction:column;}
  .doc .docbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px dashed var(--line-strong);
    background:var(--panel);}
  .doc .docbar .pg{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .doc .docbar .pgbtn{width:24px;height:24px;border:1px solid var(--line-strong);background:var(--canvas);
    border-radius:4px;color:var(--muted);font-size:12px;line-height:1;}
  .doc .docbar .spacer{flex:1;}
  .doc .page{flex:1;padding:26px 30px;}
  .doc .page .ttl{height:14px;width:46%;background:#dfe2e7;border-radius:3px;margin-bottom:16px;}
  .doc .page .ln{height:9px;background:#e3e6ea;border-radius:3px;margin:8px 0;}
  .doc .page .ln.s{width:88%;} .doc .page .ln.m{width:74%;} .doc .page .ln.x{width:62%;}
  .doc .page .blk{height:78px;background:#e3e6ea;border-radius:4px;margin:18px 0;width:55%;}

  .stage-foot{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap;}
  .btn-prev{background:var(--panel);border:1px solid var(--line-strong);color:var(--ink);
    padding:10px 16px;border-radius:5px;font-size:13.5px;font-weight:500;}
  .btn-prev:disabled{opacity:.4;cursor:not-allowed;}
  .btn-next{background:var(--accent);border:none;color:#fff;padding:10px 20px;border-radius:5px;
    font-size:13.5px;font-weight:600;}
  .btn-next:hover{filter:brightness(1.06);}
  .dl{font-size:12.5px;color:var(--muted);text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;}
  .dl:hover{color:var(--ink);}
  .dl::before{content:"↓";font-weight:700;}
  .dl-group{margin-left:auto;display:inline-flex;gap:18px;align-items:center;flex-wrap:wrap;}

  /* ---------- Browse-by-concern finder (right-hand nav) ---------- */
  .finder{border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);overflow:hidden;position:sticky;top:78px;}
  .finder .note{margin:12px;}
  .finder-head{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
    background:none;border:none;padding:14px 16px;}
  .finder-head:hover{background:rgba(44,110,116,.04);}
  .fh-txt{display:flex;flex-direction:column;flex:1;}
  .fh-title{font-size:14px;font-weight:600;color:var(--ink);}
  .fh-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .finder .chev{font-size:13px;color:var(--muted);flex:none;}
  .finder-body{display:none;padding:2px 16px 16px;border-top:1px solid var(--line);}
  .finder.open .finder-body{display:block;}
  .cgroup{padding:12px 0;border-bottom:1px dashed var(--line);}
  .cgroup:last-child{border-bottom:none;}
  .clabel{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint);margin-bottom:9px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:12.5px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line-strong);border-radius:999px;padding:6px 13px;}
  .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---------- Completion ---------- */
  .done-wrap{max-width:640px;margin:60px auto;text-align:center;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:44px 40px;}
  .done-wrap .check{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;
    display:grid;place-items:center;margin:0 auto 18px;font-size:28px;}
  .done-wrap h2{margin:0 0 10px;font-size:24px;}
  .done-wrap p{color:var(--muted);margin:0 auto 22px;max-width:46ch;}
  .next-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin:24px 0 28px;}
  .next-cards .nc{border:1px solid var(--line);border-radius:5px;padding:14px 16px;}
  .next-cards .nc .h{font-weight:600;font-size:14px;margin:0 0 4px;}
  .next-cards .nc .d{font-size:12.5px;color:var(--muted);margin:0;}
  .done-wrap .restart{background:var(--panel);border:1px solid var(--line-strong);
    padding:10px 18px;border-radius:5px;font-size:13.5px;}

  @media (max-width:820px){
    .cards{grid-template-columns:1fr;}
    .journey{grid-template-columns:1fr;}
    .rail{position:static;}
    .finder{position:static;}
    .next-cards{grid-template-columns:1fr;}
    .landing h1{font-size:28px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body data-screen="landing">
  <div class="fidelity-strip">Wireframe · low fidelity · structure &amp; flow only — visual design comes later</div>

  <header class="topbar">
    <div class="brand">
      <div class="logo-ph">LOGO</div>
      <div>
        <div class="name">ClinicalKey AI</div>
        <div class="sub">Customer Hub</div>
      </div>
    </div>
    <span class="role-chip" id="roleChip">—</span>
    <span class="spacer"></span>
    <a class="tlink" href="https://www.elsevier.support/clinicalkeyai" target="_blank" rel="noopener">Need help? Support Center ↗</a>
    <button class="notes-toggle" data-action="toggle-notes"><span class="dot"></span>Design notes</button>
  </header>

  <main id="app"></main>

<script>
(function(){
  "use strict";

  // ---- Journey data (from Digital Engagement Assets workflow) ----
  var shared = [
    {title:"Introducing ClinicalKey AI", type:"video", cat:"Get oriented", concern:"What is ClinicalKey AI?",
     narr:"Start here. A short overview of what ClinicalKey AI does and where it fits in your day — so the rest of this path has context."},
    {title:"Get Started Guide", type:"doc", cat:"Get oriented", concern:"How do I get started?",
     narr:"The essentials to get up and running. Read it here; we’ll point you to the next step when you’re done."},
    {title:"Frequently Asked Questions", type:"doc", cat:"Get oriented", concern:"Common first questions",
     narr:"Quick answers to the questions most customers raise in their first week."}
  ];

  var userSteps = [
    {title:"User Guide", type:"doc", cat:"Use it day to day", concern:"Everyday tasks, step by step",
     narr:"A deeper walkthrough of the everyday tasks you’ll use most."},
    {title:"Enhanced ClinicalKey AI", type:"video", cat:"Use it day to day", concern:"What’s new in the product?",
     narr:"What’s new and what it means for you: refined queries, real-time source checking, multilingual support, age-group personalization, and saved responses."},
    {title:"Setting Up Conversation Sharing", type:"doc", cat:"Use it day to day", concern:"Share a conversation with a colleague",
     narr:"Share a ClinicalKey AI conversation with a colleague when a question needs a second set of eyes."},
    {title:"Earn CME & Redeem MOC Credit", type:"doc", cat:"Credit & records", concern:"Earn CME / redeem MOC credit",
     narr:"Turn the searches you already run into CME and MOC credit — no extra coursework required."},
    {title:"App Guide", type:"doc", cat:"Use it day to day", concern:"Use it on mobile",
     narr:"Use ClinicalKey AI on mobile, at the point of care."},
    {title:"Quarterly Updates — Q1 2026", type:"doc", optional:true, cat:"Stay current", concern:"What changed this quarter?",
     narr:"Optional, ongoing. What changed this quarter. Come back when a new edition lands."}
  ];

  var adminSteps = [
    {title:"User Guide", type:"doc", cat:"Know the product", concern:"See what my users see",
     narr:"Know exactly what your users will see, so you can answer their questions with confidence."},
    {title:"Implementation Toolkit", type:"doc", cat:"Deploy & configure", concern:"Plan our rollout",
     narr:"Everything you need to plan and run your rollout in one place."},
    {title:"Enhanced ClinicalKey AI", type:"video", cat:"Know the product", concern:"What’s new in the product?",
     narr:"What’s new across the product: refined queries, real-time source checking, multilingual support, personalization, and saved responses."},
    {title:"SAML SSO Guide", type:"doc", cat:"Deploy & configure", concern:"Configure single sign-on (SSO)",
     narr:"Configure single sign-on so your users get in without a separate password."},
    {title:"Epic Integration with SSO", type:"doc", cat:"Deploy & configure", concern:"Set up Epic integration",
     narr:"Connect ClinicalKey AI inside Epic, in the workflow clinicians already use."},
    {title:"Link Resolver Setup", type:"doc", cat:"Deploy & configure", concern:"Connect our library holdings",
     narr:"Connect users to your library’s full-text holdings from within ClinicalKey AI."},
    {title:"Quarterly Updates — Q1 2026", type:"doc", optional:true, cat:"Stay current", concern:"What changed this quarter?",
     narr:"Optional, ongoing. What changed this quarter."}
  ];

  var journeys = {
    user:  {label:"User path",  steps: shared.concat(userSteps)},
    admin: {label:"Admin path", steps: shared.concat(adminSteps)}
  };

  // ---- State (in-memory only — no browser storage) ----
  var state = { screen:"landing", role:null, idx:0, done:{}, notes:false, indexOpen:false };

  var app = document.getElementById("app");
  var roleChip = document.getElementById("roleChip");

  function note(tag, html){
    return '<div class="note"><span class="tag">'+tag+'</span>'+html+'</div>';
  }

  // ---------- LANDING ----------
  function landing(){
    return '<div class="wrap landing">'+
      '<div class="hero">'+
        '<span class="eyebrow">ClinicalKey AI · Onboarding &amp; Enablement</span>'+
        '<h1>Where do I start?</h1>'+
        '<p class="lede">A guided path to getting value from ClinicalKey AI — built for customers setting things up on their own. Pick the path that fits you and we’ll take it step by step.</p>'+
      '</div>'+
      note("Why a path, not a search box",
        "The Support Center already owns <b>search and break/fix</b>. Leading here with a search bar would signal “you’re in the wrong place.” This screen answers one question — <b>where do I start</b> — the way a customer success manager would.")+
      '<div class="cards">'+
        roleCard("admin","SET","I’m an administrator",
          "Setting up and deploying ClinicalKey AI for my institution.",
          ["Plan and run your rollout","Configure SSO, Epic, and link resolver","Support your users"])+
        roleCard("user","USE","I’m a user / clinician",
          "Using ClinicalKey AI in my own practice.",
          ["Run better clinical queries","Share conversations and earn CME/MOC","Use it on mobile"])+
      '</div>'+
      note("Role fork mirrors a CSM",
        "Admins get a <b>deployment</b> path; users get a <b>value</b> path. Both share the same orientation steps, then diverge — the same way onboarding would be tailored by role if a CSM were in the room.")+
      '<div class="capture">'+
        '<span class="lbl">Optional — drop your email to save your place and get notified when content updates.</span>'+
        '<input type="email" placeholder="you@institution.org" aria-label="Email (optional)" />'+
        '<button type="button">Notify me</button>'+
      '</div>'+
      note("Access model — the “good” tier",
        "<b>No hard login wall</b> (open access, per Andrew). A soft, optional email capture gives Laura returning-visitor and utilization signal for renewals without adding friction. This is the “good” rung of the good / better / best model from your call — <b>confirm the team’s choice before build.</b>")+
    '</div>';
  }

  function roleCard(role,glyph,title,who,bullets){
    var lis = bullets.map(function(b){return "<li>"+b+"</li>";}).join("");
    return '<div class="card">'+
      '<div class="icon mono" aria-hidden="true">'+glyph+'</div>'+
      '<h3>'+title+'</h3>'+
      '<p class="who">'+who+'</p>'+
      '<ul>'+lis+'</ul>'+
      '<button class="go" data-action="choose-role" data-role="'+role+'">Start this path →</button>'+
    '</div>';
  }

  // ---------- JOURNEY ----------
  function journey(){
    var j = journeys[state.role];
    var steps = j.steps;
    var total = steps.length;
    var doneCount = steps.filter(function(_,i){return state.done[i];}).length;
    var pct = Math.round((doneCount/total)*100);

    var rail = '<aside class="rail">'+
      '<p class="rtitle">'+j.label+'</p>'+
      '<p class="rmeta">'+doneCount+' of '+total+' complete</p>'+
      '<div class="bar"><span style="width:'+pct+'%"></span></div>'+
      '<ul class="steps">'+
        steps.map(function(s,i){
          var cls = (i===state.idx?"active ":"") + (state.done[i]?"done":"");
          var mark = state.done[i] ? "✓" : (i+1);
          return '<li class="'+cls+'" data-action="goto-step" data-idx="'+i+'" tabindex="0" role="button">'+
            '<span class="num">'+mark+'</span>'+
            '<span class="stxt">'+s.title+(s.optional?'<span class="opt">Optional · ongoing</span>':'')+'</span>'+
          '</li>';
        }).join("")+
      '</ul>'+
      '<button class="switch" data-action="restart">↩ Switch path</button>'+
    '</aside>';

    var s = steps[state.idx];
    var isFirst = state.idx===0;
    var isLast = state.idx===total-1;

    var stage = '<section class="stage">'+
      '<span class="eyebrow">Step '+(state.idx+1)+' of '+total+(s.optional?" · optional":"")+'</span>'+
      '<h2>'+s.title+'</h2>'+
      '<p class="narr">'+s.narr+'</p>'+
      (s.type==="video"?videoPH():docPH())+
      (state.idx===0 ? note("Inline embed = presentation, not duplication",
        "The asset still lives <b>once</b> in Frontify / the Resource Center. Here it’s <b>rendered in place</b> so the user never leaves the journey. This is the core differentiator — and the exact thing Laura is testing (can Frontify embed page-through on the Resource Center page?).") : "")+
      '<div class="stage-foot">'+
        '<button class="btn-prev" data-action="prev"'+(isFirst?" disabled":"")+'>← Previous</button>'+
        '<button class="btn-next" data-action="next">'+(isLast?"Finish path":"Mark done & continue")+' →</button>'+
        '<span class="dl-group">'+
          '<a class="dl" href="#" data-action="noop">Download this section</a>'+
          '<a class="dl" href="#" data-action="noop">Download full PDF</a>'+
        '</span>'+
      '</div>'+
      note("Light portability — reader keeps a choice",
        "Two download options: <b>this section</b> (the condensed, journey-native content) or the <b>full PDF</b> (the complete source asset). Covers both the “just this bit” and “give me the whole guide” cases Laura flagged — without turning the journey back into a pile of files.")+
      ((state.role==="admin" && s.title==="SAML SSO Guide") ? note("Admin sequencing — open question",
        "SSO / Epic / link resolver are <b>deployment prerequisites</b> — nothing else works until access is provisioned. Your workflow doc flagged the toolkit as “could be earlier.” Decide on Thursday whether this whole setup cluster should sit <b>ahead of</b> the enablement steps for admins.") : "")+
    '</section>';

    return '<div class="wrap"><div class="journey">'+rail+stage+concernIndex(steps)+'</div></div>';
  }

  function concernIndex(steps){
    var order = ["Get oriented","Deploy & configure","Know the product","Use it day to day","Credit & records","Stay current"];
    var groups = {};
    steps.forEach(function(s,i){ (groups[s.cat] = groups[s.cat]||[]).push({s:s,i:i}); });
    var body = order.filter(function(c){return groups[c];}).map(function(c){
      var chips = groups[c].map(function(o){
        var active = (o.i===state.idx) ? " active" : "";
        return '<button class="chip'+active+'" data-action="goto-step" data-idx="'+o.i+'">'+o.s.concern+'</button>';
      }).join("");
      return '<div class="cgroup"><span class="clabel">'+c+'</span><div class="chips">'+chips+'</div></div>';
    }).join("");

    return '<div class="finder'+(state.indexOpen?" open":"")+'">'+
      '<button class="finder-head" data-action="toggle-index" aria-expanded="'+(state.indexOpen?"true":"false")+'">'+
        '<span class="fh-txt"><span class="fh-title">Looking for something specific?</span>'+
        '<span class="fh-sub">Jump straight to a topic — you’ll land on the right step, with its guidance.</span></span>'+
        '<span class="chev" aria-hidden="true">'+(state.indexOpen?"▾":"▸")+'</span>'+
      '</button>'+
      '<div class="finder-body">'+body+'</div>'+
      note("Browse by concern — a doorway into the journey, not a search box",
        "This serves the <b>“I just need one thing”</b> learner without breaking curation: each concern <b>deep-links to a step</b> with its context intact, so it never collapses into the Resource Center’s open pile or the Support Center’s search box. It’s scoped to <b>this path</b> — users see user concerns, admins see deployment concerns. Distinct from asking the <b>product</b> a clinical question, and from asking <b>Support</b> a break/fix question.")+
    '</div>';
  }

  function videoPH(){
    return '<div class="media video"><span class="kind">Embedded video · plays inline</span>'+
      '<div class="play" aria-hidden="true"></div>'+
      '<div class="vcap">Video renders in the page — no link-out</div></div>';
  }
  function docPH(){
    return '<div class="media doc"><span class="kind">Embedded document · page through inline</span>'+
      '<div class="docbar"><button class="pgbtn" aria-label="Previous page">‹</button>'+
        '<span class="pg">Page 1 / 6</span>'+
        '<button class="pgbtn" aria-label="Next page">›</button><span class="spacer"></span>'+
        '<span class="pg">Frontify asset</span></div>'+
      '<div class="page"><div class="ttl"></div>'+
        '<div class="ln"></div><div class="ln s"></div><div class="ln m"></div>'+
        '<div class="blk"></div>'+
        '<div class="ln"></div><div class="ln s"></div><div class="ln x"></div></div>'+
    '</div>';
  }

  // ---------- COMPLETION ----------
  function done(){
    var j = journeys[state.role];
    return '<div class="wrap"><div class="done-wrap">'+
      '<div class="check" aria-hidden="true">✓</div>'+
      '<h2>You’ve completed the '+j.label.toLowerCase()+'</h2>'+
      '<p>That’s the core of getting going with ClinicalKey AI. Here’s where to go from here.</p>'+
      '<div class="next-cards">'+
        '<div class="nc"><p class="h">Keep current</p><p class="d">New quarterly updates appear here as they’re released.</p></div>'+
        '<div class="nc"><p class="h">Hit a snag?</p><p class="d">The Support Center handles account, access, and troubleshooting questions.</p></div>'+
      '</div>'+
      note("End state points onward",
        "A CSM closes the loop — so does the hub: what’s ongoing, and the one sanctioned link-out to <b>Support</b> for break/fix. That handoff is what keeps this from duplicating the Support Center.")+
      '<button class="restart" data-action="restart">↩ Back to start</button>'+
    '</div></div>';
  }

  // ---------- Render & events ----------
  function render(){
    document.body.setAttribute("data-screen", state.screen);
    if(state.role){
      roleChip.textContent = journeys[state.role].label;
    }
    if(state.screen==="landing") app.innerHTML = landing();
    else if(state.screen==="journey") app.innerHTML = journey();
    else app.innerHTML = done();
    window.scrollTo({top:0,behavior:"auto"});
  }

  function handle(action, el){
    if(action==="toggle-notes"){
      state.notes = !state.notes;
      document.body.classList.toggle("notes-on", state.notes);
      return;
    }
    if(action==="choose-role"){
      state.role = el.getAttribute("data-role");
      state.idx = 0; state.done = {}; state.screen = "journey";
      render(); return;
    }
    if(action==="goto-step"){
      state.idx = parseInt(el.getAttribute("data-idx"),10);
      render(); return;
    }
    if(action==="next"){
      var total = journeys[state.role].steps.length;
      state.done[state.idx] = true;
      if(state.idx < total-1){ state.idx++; render(); }
      else { state.screen = "done"; render(); }
      return;
    }
    if(action==="prev"){
      if(state.idx>0){ state.idx--; render(); }
      return;
    }
    if(action==="restart"){
      state.screen="landing"; state.role=null; state.idx=0; state.done={};
      render(); return;
    }
    if(action==="toggle-index"){
      state.indexOpen = !state.indexOpen;
      render(); return;
    }
    if(action==="noop"){ return; }
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    e.preventDefault();
    handle(el.getAttribute("data-action"), el);
  });
  document.addEventListener("keydown", function(e){
    if((e.key==="Enter"||e.key===" ") && e.target.matches('.steps li[data-action]')){
      e.preventDefault();
      handle("goto-step", e.target);
    }
  });

  render();
})();
</script>
</body>
</html>
